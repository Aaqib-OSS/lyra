<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Neon B2: Rain Alley (polished)</title>
<style>
:root{--pink:#ff4fa3;--cyan:#6beaff;--ink:#050912;--glass:rgba(10,18,34,.62);--hair:rgba(255,255,255,.14);--u:1vh}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--ink);overflow:hidden;font-family:'Inter','Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;color:#fff}
.stage{position:relative;width:100vw;height:100vh;overflow:hidden;--p:0;--sweep:-40%;
  background:radial-gradient(80% 60% at 18% 30%,rgba(255,79,163,.20),transparent 70%),radial-gradient(70% 55% at 85% 20%,rgba(107,234,255,.15),transparent 70%),linear-gradient(180deg,#07101d 0%,#0a1526 66%,#04070d 100%)}
/* wall: soft bricks, never harsh */
.wall{position:absolute;inset:-4% -4% 22% -4%;opacity:.38;animation:drift 70s ease-in-out infinite alternate;
  background:repeating-linear-gradient(0deg,transparent 0 5.6vh,rgba(0,0,0,.55) 5.6vh 5.8vh),repeating-linear-gradient(90deg,transparent 0 17vh,rgba(0,0,0,.4) 17vh 17.2vh);
  -webkit-mask:linear-gradient(180deg,#000 20%,rgba(0,0,0,.25))}
@keyframes drift{to{transform:scale(1.05) translateX(-1.5%)}}
/* light from a passing car sweeps over the wall on every new line */
.sweep{position:absolute;inset:0 0 22% 0;pointer-events:none;background:linear-gradient(100deg,transparent calc(var(--sweep) - 14%),rgba(255,230,200,.10) var(--sweep),transparent calc(var(--sweep) + 14%));mix-blend-mode:screen}
.fog{position:absolute;inset:0;background:radial-gradient(45% 26% at 50% 78%,rgba(255,79,163,.18),transparent),radial-gradient(35% 22% at 18% 76%,rgba(107,234,255,.15),transparent)}
/* street */
.street{position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(180deg,#0b1424 0%,#04070d 100%);border-top:1px solid rgba(255,255,255,.08)}
.street:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent);animation:sheen 9s ease-in-out infinite alternate}
@keyframes sheen{from{transform:translateX(-30%)}to{transform:translateX(30%)}}
.ring{position:absolute;width:5vh;height:1.1vh;border:1px solid rgba(190,240,255,.55);border-radius:50%;opacity:0;animation:ring 2.8s cubic-bezier(.2,.6,.3,1) infinite}
@keyframes ring{0%{opacity:.85;transform:scale(.15)}100%{opacity:0;transform:scale(2.6)}}
/* rain: two depth layers */
.rain{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.rain i{position:absolute;top:-14%;border-radius:2px;background:linear-gradient(180deg,transparent,rgba(200,236,255,.7));transform:rotate(11deg);animation:fall linear infinite}
@keyframes fall{to{transform:translate(-8vh,128vh) rotate(11deg)}}
/* video window */
.shop{position:absolute;left:5vw;top:9vh;width:33vw;aspect-ratio:16/10;border-radius:2.2vh;background:#000;overflow:hidden;
  box-shadow:0 0 0 .5vh #14223a,0 0 0 calc(.5vh + 1px) rgba(255,255,255,.12),0 0 0 calc(.5vh + 2px) rgba(107,234,255,.55),0 3vh 8vh rgba(0,0,0,.6),0 0 6vh rgba(107,234,255,.22)}
.vid{position:absolute;inset:0;background:radial-gradient(60% 80% at 25% 40%,#ff4fa3 0,transparent 60%),radial-gradient(70% 90% at 80% 65%,#4a7dff 0,transparent 60%),#10142a;animation:vm 9s ease-in-out infinite alternate}
@keyframes vm{to{filter:hue-rotate(45deg) brightness(1.1);background-position:18% 26%}}
.glass{position:absolute;inset:0;z-index:3;background:linear-gradient(115deg,rgba(255,255,255,.10),transparent 30%,transparent 70%,rgba(255,255,255,.05)),radial-gradient(120% 100% at 50% 120%,rgba(0,0,0,.35),transparent 60%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),inset 0 -2vh 4vh rgba(0,0,0,.25)}
.drop{position:absolute;z-index:3;width:1.1vh;height:1.4vh;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.8),rgba(255,255,255,.12) 40%,transparent 70%);animation:slide linear infinite;opacity:.8}
@keyframes slide{0%{transform:translateY(-4vh);opacity:0}8%{opacity:.8}100%{transform:translateY(26vh);opacity:0}}
.badge{position:absolute;left:5vw;top:5.2vh;display:flex;align-items:center;gap:1vh;font:600 1.5vh/1 Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.8)}
.badge i{width:1vh;height:1vh;border-radius:50%;background:var(--pink);box-shadow:0 0 1.2vh var(--pink);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
/* lyrics sign */
.board{position:absolute;left:5vw;width:66vw;top:51vh;bottom:24vh;display:flex;flex-direction:column;justify-content:center;gap:2.4vh}
.row{display:flex;flex-wrap:wrap;gap:0 .26em;font-weight:800;font-size:min(4.7vw,8.4vh);letter-spacing:-.04em;line-height:1.06;font-family:'Unbounded','Inter',sans-serif}
.w{color:rgba(170,195,230,.36);transition:color .35s cubic-bezier(.2,.7,.2,1)}
.w.on{color:#ffd9ec;text-shadow:0 0 .5vh rgba(255,255,255,.9),0 0 1.8vh rgba(255,79,163,.85),0 0 5vh rgba(255,79,163,.4);animation:on .38s cubic-bezier(.2,.7,.2,1) 1}
.w.now{color:#effcff;text-shadow:0 0 .5vh rgba(255,255,255,.95),0 0 1.8vh rgba(107,234,255,.9),0 0 5vh rgba(107,234,255,.45)}
.w.tired.on{animation:tired 5.5s linear infinite}
@keyframes on{0%{opacity:.1;filter:brightness(2.4);transform:translateY(.8vh)}60%{opacity:1;filter:brightness(1.35)}100%{opacity:1;filter:none;transform:none}}
@keyframes tired{0%,58%,64%,100%{opacity:1}60%,62%{opacity:.15}}
.next{display:flex;flex-wrap:wrap;gap:0 .45em;font:600 min(2vw,3.2vh)/1.2 Inter,sans-serif;color:rgba(190,215,245,.42);letter-spacing:-.01em;padding-left:.3vh}
.reflect{position:absolute;left:5vw;width:66vw;bottom:6vh;height:15vh;overflow:hidden;transform:scaleY(-1);opacity:.30;filter:blur(2.2px);-webkit-mask:linear-gradient(0deg,#000,transparent 85%)}
.reflect .row{position:absolute;top:0}
/* hanging card */
.hang{position:absolute;right:5vw;top:0;width:17vw;min-width:150px}
.chain{position:absolute;top:0;width:2px;height:10vh;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.18))}
.sign{margin-top:9.5vh;border-radius:2.4vh;padding:1.8vh;background:var(--glass);backdrop-filter:blur(14px) saturate(1.3);
  box-shadow:0 0 0 1px var(--hair),0 0 0 2px rgba(107,234,255,.28),0 2.4vh 6vh rgba(0,0,0,.5),0 0 5vh rgba(107,234,255,.16);animation:sway 7s ease-in-out infinite;transform-origin:50% -9.5vh}
@keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
.cov{width:100%;aspect-ratio:1;border-radius:1.6vh;position:relative;background:conic-gradient(from 210deg,#ff4fa3,#4a7dff,#6beaff,#ffd84a,#ff4fa3);box-shadow:0 1.4vh 3vh rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.22)}
.cov:after{content:"";position:absolute;inset:34%;border-radius:50%;background:#0a1220;box-shadow:0 0 0 .3vh rgba(255,255,255,.75)}
.sign h3{margin-top:1.8vh;font-size:2.3vh;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sign p{margin-top:.4vh;font-size:1.6vh;color:rgba(190,215,245,.7)}
.bar{margin-top:1.8vh;height:.5vh;border-radius:9px;background:rgba(255,255,255,.14);position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;width:calc(var(--p)*100%);border-radius:9px;background:linear-gradient(90deg,var(--cyan),var(--pink))}
.bar i:after{content:"";position:absolute;right:-.7vh;top:50%;width:1.4vh;height:1.4vh;margin-top:-.7vh;border-radius:50%;background:#fff;box-shadow:0 0 1.2vh rgba(107,234,255,.9)}
.times{display:flex;justify-content:space-between;margin-top:1vh;font:500 1.3vh Inter;color:rgba(190,215,245,.6);font-variant-numeric:tabular-nums}
.btns{display:flex;justify-content:space-between;align-items:center;margin-top:1.2vh}
.btns svg{width:3.6vh;height:3.6vh;fill:#fff;opacity:.9}
.btns .pp{width:6.2vh;height:6.2vh;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 .8vh 2vh rgba(255,79,163,.45)}
.btns .pp svg{fill:#0a1220;width:3vh;height:3vh}
/* states */
.alt,.noise,.art{display:none}
.alt{position:absolute;left:5vw;width:66vw;top:51vh;bottom:24vh;flex-direction:column;justify-content:center;gap:1.6vh}
.alt .t{font-weight:800;font-size:min(4.6vw,8vh);letter-spacing:-.045em;line-height:1.02;font-family:'Unbounded','Inter';color:#ffd9ec;text-shadow:0 0 .5vh rgba(255,255,255,.9),0 0 1.8vh rgba(255,79,163,.85),0 0 5vh rgba(255,79,163,.4)}
.alt .a{font:600 min(1.8vw,3vh) Inter;letter-spacing:.24em;text-transform:uppercase;color:rgba(190,215,245,.8)}
.alt .pg{font:500 min(2.1vw,3.5vh)/1.35 Inter;color:#e7eefb;max-width:46em}
.pill{align-self:flex-start;font:700 1.4vh Inter;letter-spacing:.14em;text-transform:uppercase;padding:.8vh 1.4vh;border-radius:99px;color:var(--cyan);background:rgba(107,234,255,.10);box-shadow:inset 0 0 0 1px rgba(107,234,255,.4)}
.eq{display:flex;gap:.6vh;align-items:flex-end;height:5vh}.eq i{width:.8vh;border-radius:3px;background:linear-gradient(180deg,var(--cyan),var(--pink));animation:eq 1.1s ease-in-out infinite}
@keyframes eq{0%,100%{height:18%}50%{height:100%}}
.art,.noise{position:absolute;inset:0;z-index:2}
.art{align-items:center;justify-content:center;flex-direction:column;gap:1.4vh;background:radial-gradient(circle at 50% 40%,rgba(255,79,163,.22),transparent 65%),#091221}
.art b{font:700 1.6vh Inter;letter-spacing:.22em;color:rgba(255,255,255,.88);text-transform:uppercase}
.art em{font:500 1.5vh Inter;font-style:normal;color:rgba(190,215,245,.7)}
.noise{background:repeating-linear-gradient(0deg,#1d2432 0 2px,#7d8696 2px 3px);opacity:.4;animation:nz .22s steps(3) infinite}@keyframes nz{50%{background-position:0 2px}}
[data-l=plain] .board,[data-l=none] .board,[data-l=wait] .board,[data-l=idle] .board,[data-l=plain] .reflect,[data-l=none] .reflect,[data-l=wait] .reflect,[data-l=idle] .reflect{display:none}
[data-l=plain] .a-plain,[data-l=none] .a-none,[data-l=idle] .a-none,[data-l=wait] .a-wait{display:flex}
[data-v=art] .art{display:flex}[data-v=art] .vid{opacity:0}[data-v=noise] .noise{display:block}
[data-l=idle] .rain{opacity:.3}[data-l=idle] .sign{animation-play-state:paused;filter:saturate(.5)}
.sw{position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:50;display:flex;gap:3px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);padding:3px;border-radius:99px}
.sw button{font:600 11px Inter,sans-serif;color:#fff;background:transparent;border:0;border-radius:99px;padding:6px 10px;cursor:pointer;white-space:nowrap}.sw button.on{background:#fff;color:#07101d}
</style></head><body>
<div class="stage" id="st">
  <div class="wall"></div><div class="sweep" id="sweep"></div><div class="fog"></div>
  <div class="street"></div><div id="rings"></div>
  <div class="badge"><i></i><span id="bd">Now playing</span></div>
  <div class="shop"><div class="vid"></div><div class="noise"></div>
    <div class="art"><b id="ab">No video</b><em id="am">Just the music</em><div class="eq"><i></i><i style="animation-delay:.2s"></i><i style="animation-delay:.1s"></i><i style="animation-delay:.3s"></i><i style="animation-delay:.15s"></i></div></div>
    <div class="glass"></div><div id="drops"></div></div>
  <div class="board"><div class="row" id="cur"></div><div class="next" id="nxt"></div></div>
  <div class="reflect"><div class="row" id="rf"></div></div>
  <div class="alt a-plain"><span class="pill">Not synced</span><p class="pg">Rain on the neon sign<br>Every street knows my name<br>Hold the light a little longer<br>Don't let it go out</p></div>
  <div class="alt a-none"><span class="a" id="h2">Now playing</span><div class="t">Midnight Overdrive</div><span class="a">Echo Avenue</span><div class="eq"><i></i><i style="animation-delay:.15s"></i><i style="animation-delay:.3s"></i><i style="animation-delay:.1s"></i><i style="animation-delay:.4s"></i><i style="animation-delay:.2s"></i></div></div>
  <div class="alt a-wait"><span class="pill">Retry in <span id="cd">8</span>s</span><div class="t">Checking the signal...</div></div>
  <div class="hang"><div class="chain" style="left:22%"></div><div class="chain" style="right:22%"></div>
    <div class="sign"><div class="cov"></div><h3>Midnight Overdrive</h3><p>Echo Avenue</p><div class="bar"><i></i></div><div class="times"><span id="t1">0:00</span><span id="t2">-3:12</span></div>
      <div class="btns"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg><div class="pp"><svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></div><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></div></div></div>
  <div class="rain" id="rain"></div>
  <div class="sw" id="sw"></div>
</div>
<script>
const st=document.getElementById('st');
const rain=document.getElementById('rain');for(let i=0;i<110;i++){const far=i%3!=0,e=document.createElement('i');e.style.cssText=`left:${(i*37)%112}%;width:${far?1:1.8}px;height:${far?5+i%4:9+i%4}vh;animation-duration:${far?.9+(i%5)*.1:.55+(i%4)*.07}s;animation-delay:${-(i*.13)%2}s;opacity:${far?.18+(i%4)/16:.35+(i%3)/9}`;rain.appendChild(e)}
const rg=document.getElementById('rings');for(let i=0;i<10;i++){const e=document.createElement('i');e.className='ring';e.style.cssText=`left:${6+(i*41)%84}%;bottom:${2+(i*5)%15}%;animation-delay:${(i*.57)%2.8}s`;rg.appendChild(e)}
const dr=document.getElementById('drops');for(let i=0;i<9;i++){const e=document.createElement('i');e.className='drop';e.style.cssText=`left:${(i*47+9)%92}%;top:${(i*23)%50}%;animation-duration:${5+(i%4)*1.4}s;animation-delay:${-(i*1.3)}s;transform:scale(${.7+(i%3)*.4})`;dr.appendChild(e)}
const lines=[["Rain","on","the","neon","sign"],["Every","street","knows","my","name"],["Hold","the","light","a","little","longer"],["Don't","let","it","go","out"]];
let li=0,wi=0;const cur=document.getElementById('cur'),rf=document.getElementById('rf'),nx=document.getElementById('nxt');
function draw(){const h=lines[li].map((w,i)=>`<span class="w ${i<wi?'on':''} ${i==wi-1?'now':''} ${i==2?'tired':''}">${w}</span>`).join('');cur.innerHTML=h;rf.innerHTML=h;nx.innerHTML=lines[(li+1)%lines.length].map(w=>`<span>${w}</span>`).join('')}
draw();let sw0=0;
setInterval(()=>{wi++;if(wi>lines[li].length){wi=0;li=(li+1)%lines.length;sw0=performance.now()}draw()},440);
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function loop(t){const p=(t%42000)/42000;st.style.setProperty('--p',p);const k=Math.min(1,(t-sw0)/1400);st.style.setProperty('--sweep',(-30+k*160)+'%');
 document.getElementById('t1').textContent=fmt(p*192);document.getElementById('t2').textContent='-'+fmt((1-p)*192);requestAnimationFrame(loop)}requestAnimationFrame(loop);
const STATES={A:['on','sync','Full experience'],B:['art','sync','Lyrics only'],C:['on','plain','Video + unsynced'],D:['art','plain','Text only'],E:['on','none','Video, no words'],F:['art','none','Music only'],G:['noise','wait','Waiting'],H:['art','idle','Idle / ad']};
const sw=document.getElementById('sw');
function setS(k){const [v,l]=STATES[k];st.dataset.v=v;st.dataset.l=l;[...sw.children].forEach(b=>b.classList.toggle('on',b.dataset.k==k));document.getElementById('h2').textContent=l=='idle'?'Nothing playing':(l=='none'?'No words for this one':'Now playing');document.getElementById('am').textContent=k=='G'?'Looking for a clip':'Just the music';document.getElementById('ab').textContent=k=='G'?'Loading':'No video';document.getElementById('bd').textContent=l=='idle'?'Idle':'Now playing'}
for(const k in STATES){const b=document.createElement('button');b.dataset.k=k;b.textContent=k+' · '+STATES[k][2];b.onclick=()=>setS(k);sw.appendChild(b)}
setS((location.hash||'#A').slice(1)||'A');addEventListener('hashchange',()=>setS(location.hash.slice(1)||'A'));
setInterval(()=>{const c=document.getElementById('cd');c.textContent=((+c.textContent+7)%9)+1},1000);
</script></body></html>
