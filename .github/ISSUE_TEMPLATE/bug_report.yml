name: Bug report
description: Something in Lyra does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please check the [troubleshooting guide](https://github.com/DhruvHarani1/lyra/blob/main/docs/troubleshooting.md) first.
        Lyra sends nothing anywhere; the report below is made on your PC and you decide what to paste.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Steps to reproduce help a lot.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics report
      description: In Lyra open Settings -> About -> Copy diagnostics, then paste here. Read it first; it leaves out tokens, keys and your user name, but remove anything you do not want to share.
      render: text
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Windows, Linux, Android, Android TV, Other]
    validations:
      required: true
