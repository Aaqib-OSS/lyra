name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the code: a compromised dependency or a hostile pull request gets a read-only token
permissions:
  contents: read

# a newer push to the same pull request replaces the older run; runs on main are never cancelled (the release gate reads them)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # version files agree, release notes card and fastlane changelog exist for the current version
      - run: npm run release:check
      - run: npm run build

  # Renders every vibe on phone, tablet and desktop sizes in a real browser and clicks every setting.
  # Fails on clipped text, controls outside the window, colliding lyrics, poor contrast, dead switches.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui:quick
      - run: npm run test:settings
      - run: npm run test:ui:states
      - name: Install ffmpeg (makes the test clip for the video pause/resume check)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm run test:video
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ui-test-failures
          path: ui-test-out
          retention-days: 7
