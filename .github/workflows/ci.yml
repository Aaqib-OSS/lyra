name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the code: a compromised dependency or a hostile pull request gets a read-only token
permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Renders every vibe on phone, tablet and desktop sizes in a real browser and clicks every setting.
  # Fails on clipped text, controls outside the window, colliding lyrics, poor contrast, dead switches.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui:quick
      - run: npm run test:settings
      - run: npm run test:ui:states
      - name: Install ffmpeg (makes the test clip for the video pause/resume check)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm run test:video
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ui-test-failures
          path: ui-test-out
          retention-days: 7
