name: Release

# Push a tag like v0.1.0 to build the Windows installer and attach it to a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release named after the version in package.json (creates the tag). Leave off for a dry run.'
        type: boolean
        default: false
      force:
        description: 'Publish even though the CI workflow has not succeeded for this commit (emergency override, see docs/DISTRIBUTION.md).'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read # the release gate reads the CI runs of this commit

# two releases of the same workflow never build at once
concurrency:
  group: release-windows
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Code signing is OFF until the owner adds these secrets (docs/release-audit.md, "Code signing"). Absent = unsigned, as today.
      HAS_AZURE_SIGN: ${{ secrets.AZURE_SIGN_ACCOUNT != '' }}
      HAS_PFX: ${{ secrets.WIN_CSC_LINK != '' }}
    steps:
      # A release is published only for a commit whose CI run (typecheck, tests, build, UI checks) is green. This workflow
      # runs on its own, so without this gate a tag or "Run workflow" could ship a commit CI had rejected (0.24.1 did).
      # `force` is the documented override; a tag push cannot set it (re-run by hand with force to override).
      - name: Release gate (CI must be green for this commit)
        if: ${{ github.ref_type == 'tag' || inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "::warning::force=true: publishing ${GITHUB_SHA} without a successful CI run"
            exit 0
          fi
          latest=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow ci.yml --commit "${GITHUB_SHA}" --limit 20 --json status,conclusion --jq '.[0] // empty | "\(.status) \(.conclusion)"')
          if [ -z "$latest" ]; then
            echo "::error::No CI run found for commit ${GITHUB_SHA}. Push it to main (or open a PR) and wait for CI, or re-run with force=true."
            exit 1
          fi
          if [ "$latest" != "completed success" ]; then
            echo "::error::The latest CI run for commit ${GITHUB_SHA} is '${latest}', not 'completed success'. Fix or wait for CI, or re-run with force=true."
            exit 1
          fi
          echo "CI is green for ${GITHUB_SHA}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      # version files agree, a tag matches package.json, and the release notes card exists (scripts/release.mjs)
      - name: Check the release metadata
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then node scripts/release.mjs check --tag "${{ github.ref_name }}"; else node scripts/release.mjs check; fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Signing, only when the owner has added the secrets. Two routes: Azure Trusted Signing, or a .pfx certificate.
      - name: Enable Azure Trusted Signing
        if: env.HAS_AZURE_SIGN == 'true'
        shell: bash
        run: |
          echo "AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> "$GITHUB_ENV"
          echo "AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> "$GITHUB_ENV"
          echo "AZURE_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET }}" >> "$GITHUB_ENV"
          echo "SIGN_ARGS=-c.win.azureSignOptions.publisherName=${{ secrets.AZURE_PUBLISHER_NAME }} -c.win.azureSignOptions.endpoint=${{ secrets.AZURE_SIGN_ENDPOINT }} -c.win.azureSignOptions.codeSigningAccountName=${{ secrets.AZURE_SIGN_ACCOUNT }} -c.win.azureSignOptions.certificateProfileName=${{ secrets.AZURE_SIGN_PROFILE }}" >> "$GITHUB_ENV"
      - name: Enable certificate signing
        if: env.HAS_PFX == 'true' && env.HAS_AZURE_SIGN != 'true'
        shell: bash
        run: |
          echo "CSC_LINK=${{ secrets.WIN_CSC_LINK }}" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=${{ secrets.WIN_CSC_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build installer
        shell: bash
        run: npm run dist -- $SIGN_ARGS

      # a signing secret that is set must produce a valid signature, or the release stops here
      - name: Verify the installer signature
        if: env.HAS_AZURE_SIGN == 'true' || env.HAS_PFX == 'true'
        shell: pwsh
        run: |
          $bad = Get-ChildItem release/Lyra-Setup-*.exe | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }
          if ($bad) { Write-Error "Not validly signed: $($bad.Name)"; exit 1 }
          Get-ChildItem release/Lyra-Setup-*.exe | ForEach-Object { (Get-AuthenticodeSignature $_.FullName).SignerCertificate.Subject }
      - name: Keep the installer as a build artifact (download it from the run page to test before releasing)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Lyra-Windows-${{ github.sha }}
          path: |
            release/Lyra-Setup-*.exe
            release/latest.yml
          retention-days: 14
      - name: Publish release
        if: ${{ github.ref_type == 'tag' || inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then TAG="${{ github.ref_name }}"; else TAG="v$(node -p "require('./package.json').version")"; fi
          # a tag with a dash (v0.18.0-beta.1) is a pre-release: it never becomes "latest", so the updater skips it
          PRE=""
          case "$TAG" in *-*) PRE="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG already exists" >&2; exit 1; fi
          gh release create "$TAG" \
            release/Lyra-Setup-*.exe release/Lyra-Setup-*.exe.blockmap release/latest.yml \
            --target "${{ github.sha }}" \
            --title "Lyra $TAG" \
            --generate-notes $PRE
